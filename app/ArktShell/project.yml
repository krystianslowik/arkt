name: ArktShell
options:
  bundleIdPrefix: dev.arkt
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  # Release settings plus the scripted smoke (`-ArktSmoke YES`): optimized pacing runs. Never shipped.
  Profile: release
  # Development build on the real engine (week-3 plan, Task W3-3): main.swift hands the process to the engine
  # framework's ChromeMain. Additive: Debug, Release and Profile build the FakeEngine app as before.
  Engine: debug
  # The shipped app (#334): the Engine configuration's engine-backed app, optimized (-O, whole module), without the
  # test-only code: no EngineAPITestSupport (so no contract runner), no ARKT_* overrides, product identity.
  Distribution: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    ARKT_PRINCIPAL_CLASS: NSApplication
    # Info.plist `ArktEnvironmentOverrides`: YES only where the build reads the ARKT_* environment overrides (Debug,
    # Profile, Engine); NO in Release and any new config. The UI test harness refuses to launch a bundle without YES.
    ARKT_ENV_OVERRIDES: "NO"
  configs:
    Debug:
      ARKT_ENV_OVERRIDES: "YES"
    Profile:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARKT_SMOKE_BUILD"
      ARKT_ENV_OVERRIDES: "YES"
    Engine:
      # ARKT_TEST_SWITCHES (#334): the test-only code of the engine app (the ARKT_* overrides, the contract runner
      # and its switches). Distribution leaves it out.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARKT_CHROMIUM_ENGINE ARKT_TEST_SWITCHES"
      # Chromium CHECKs that NSApp is a BrowserCrApplication (chrome_browser_application_mac.mm).
      ARKT_PRINCIPAL_CLASS: BrowserCrApplication
      # Development only; the signed release bundle is Task W3-11, from a configuration that reads no overrides.
      ENABLE_HARDENED_RUNTIME: NO
      # Reads the ARKT_* overrides (AppEnvironment, ARKT_CHROMIUM_ENGINE), so a development run can keep the shell's
      # data, Arc folder and defaults away from the real ones (ARKT_DATA_DIR and the rest).
      ARKT_ENV_OVERRIDES: "YES"
      # Keep the Swift entry point in the main executable, like Chromium's stub, instead of
      # Xcode's debug stub plus ArktShell.debug.dylib.
      ENABLE_DEBUG_DYLIB: NO
    Distribution:
      # No DEBUG, ARKT_SMOKE_BUILD or ARKT_TEST_SWITCHES, and ARKT_ENV_OVERRIDES stays at the base NO: the overrides
      # and the test switches are compiled out (DistributionConfigurationTests).
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARKT_CHROMIUM_ENGINE"
      ARKT_PRINCIPAL_CLASS: BrowserCrApplication
      ENABLE_DEBUG_DYLIB: NO
packages:
  ShellKit:
    path: ShellKit
  ArktCore:
    path: ../ArktCore
targets:
  ArktShell:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Arkt
        CFBundleDisplayName: Arkt
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: $(ARKT_PRINCIPAL_CLASS)
        ArktEnvironmentOverrides: $(ARKT_ENV_OVERRIDES)
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.productivity
        # macOS shows these in its own camera, microphone and location prompts when a site asks (#133). The
        # deployment target is macOS 15, so the deprecated NSLocationUsageDescription is not needed.
        NSCameraUsageDescription: A website you visit can ask to use your camera.
        NSMicrophoneUsageDescription: A website you visit can ask to use your microphone.
        NSLocationWhenInUseUsageDescription: A website you visit can ask to use your location.
        # Default browser (onboarding spec, section 15, item 3): web links and web documents, so macOS lists Arkt
        # as a browser and the first run's "Make default" can ask for it.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
            CFBundleTypeRole: Viewer
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html, public.xhtml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkt.Arkt
        PRODUCT_NAME: ArktShell
      configs:
        # The product is Arkt.app (the executable is Arkt too).
        Distribution:
          PRODUCT_NAME: Arkt
          # The kit only: EngineAPITestSupport (and with it the contract runner) is not linked.
          OTHER_LDFLAGS: "$(inherited) $(BUILT_PRODUCTS_DIR)/ChromiumEngineKit.o"
          OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/ShellKit/Sources/ArktEngineABI/include/module.modulemap"
        Engine:
          # The engine-only products (`link: false` below): Xcode builds them for every configuration, but only the
          # Engine binary links their objects, so Debug, Release and Profile carry no engine kit code (#268).
          OTHER_LDFLAGS: "$(inherited) $(BUILT_PRODUCTS_DIR)/ChromiumEngineKit.o $(BUILT_PRODUCTS_DIR)/EngineAPITestSupport.o"
          # The facade header's module map, which a linked product would have passed: the kit's swiftmodule loads
          # that module when App/Engine imports the kit. Not an import; App never imports the facade module.
          OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/ShellKit/Sources/ArktEngineABI/include/module.modulemap"
    # Engine and Distribution: where the engine app is and the product dir name (Engine.xcconfig and
    # Distribution.xcconfig, which include the uncommitted Local.xcconfig when it exists).
    configFiles:
      Engine: Engine.xcconfig
      Distribution: Distribution.xcconfig
    # Engine and Distribution (the script exits at once in every other configuration). Runs after the Info.plist is
    # processed (its input) and before Xcode signs the app. Copies the engine framework into Contents/Frameworks when it changed (an APFS
    # clone when on the same volume) and writes ArktEngineFrameworkName and ArktEngineFrameworkVersion from the
    # framework's own Info.plist and Versions/Current, plus CrProductDirName from ARKT_PRODUCT_DIR_NAME (Engine.xcconfig,
    # Decision 8, #128). The framework is in no embed phase, so Xcode never re-signs it.
    postBuildScripts:
      - name: Embed the engine framework (Engine and Distribution)
        basedOnDependencyAnalysis: false
        # Orders the phase after Info.plist processing in incremental builds too (without it, Xcode ran the
        # phase first and then rewrote the Info.plist, dropping the keys).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        shell: /bin/zsh
        script: |
          [[ $CONFIGURATION == Engine || $CONFIGURATION == Distribution ]] || exit 0
          if [[ -z $ARKT_PRODUCT_DIR_NAME ]]; then
            print -u2 "error: ARKT_PRODUCT_DIR_NAME is empty (Engine.xcconfig and Distribution.xcconfig set it)"
            exit 1
          fi
          if [[ -z $ARKT_ENGINE_APP || ! -d $ARKT_ENGINE_APP ]]; then
            print -u2 "error: set ARKT_ENGINE_APP in app/ArktShell/Local.xcconfig (or on the command line) to a built engine app (out/Spike/Chromium.app)"
            exit 1
          fi
          frameworks=( "$ARKT_ENGINE_APP"/Contents/Frameworks/*.framework(N) )
          if (( ${#frameworks} != 1 )); then
            print -u2 "error: expected one framework in $ARKT_ENGINE_APP/Contents/Frameworks, found ${#frameworks}"
            exit 1
          fi
          src=${frameworks[1]}
          version=$(readlink "$src/Versions/Current") || exit 1
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$src/Versions/$version/Resources/Info.plist") || exit 1
          dest="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/${src:t}"
          stamp="$DERIVED_FILE_DIR/engine-framework.stamp"
          current="$src $(stat -f '%m %z' "$src/Versions/$version/$name") $(stat -f '%m' "$src/Versions/$version/Resources/Info.plist")"
          if [[ -d $dest && -f $stamp && "$(<$stamp)" == "$current" ]]; then
            print "Engine framework unchanged: ${src:t} $version"
          else
            rm -rf "$dest"
            mkdir -p "${dest:h}" "${stamp:h}"
            cp -c -Rp "$src" "$dest" 2>/dev/null || cp -Rp "$src" "$dest" || exit 1
            print -r -- "$current" > "$stamp"
            print "Engine framework copied: ${src:t} $version"
          fi
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          plutil -replace ArktEngineFrameworkName -string "$name" "$plist" || exit 1
          plutil -replace ArktEngineFrameworkVersion -string "$version" "$plist" || exit 1
          plutil -replace CrProductDirName -string "$ARKT_PRODUCT_DIR_NAME" "$plist" || exit 1
    dependencies:
      - package: ShellKit
        product: ShellUI
      - package: ShellKit
        product: FakeEngineKit
      - package: ShellKit
        product: EngineAPI
      - package: ShellKit
        product: CoreBridge
      # Crash reports (#129): Foundation only; only App/CrashCapture imports it.
      - package: ShellKit
        product: CrashReporting
      # ChromiumEngine and the typed ArktShellEmbedder; only App/Engine (Engine configuration) imports it. Not
      # linked here: the Engine configuration's OTHER_LDFLAGS links its object (settings above).
      - package: ShellKit
        product: ChromiumEngineKit
        link: false
      # The shared engine contract, for the Engine configuration's contract runner (App/Engine, W3-9). Engine-only
      # link, like ChromiumEngineKit.
      - package: ShellKit
        product: EngineAPITestSupport
        link: false
      - package: ArktCore
        product: Persistence      # composition root only: the one GRDB link
      - package: ArktCore
        product: SidebarModel
      - package: ArktCore
        product: Archive
      - package: ArktCore
        product: ArcImport
  # XCUITest suite (track U, docs/plans/2026-10-23-ui-tests.md). Drives the Debug ArktShell.app through
  # accessibility only; every launch uses a throwaway sandbox (UITests/Harness/Sandbox.swift).
  ArktShellUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
      - path: ShellKit/Sources/ShellUI/Accessibility/AXID.swift
      - path: ShellKit/Sources/ShellUI/Accessibility/AXID+Peek.swift
      - path: ../ArktCore/Tests/ArcImportTests/Fixtures/StorableSidebar-synthetic.json
        buildPhase: resources
      - path: ../ArktCore/Tests/ArcImportTests/Fixtures/StorableArchiveItems-synthetic.json
        buildPhase: resources
    dependencies:
      - target: ArktShell
    # Xcode signs the sandboxed runner with these on top of its own (network.client only): the loopback fixture
    # server (UITests/Harness/FixtureServer.swift) has to listen on 127.0.0.1.
    entitlements:
      path: ArktShellUITests.entitlements
      properties:
        com.apple.security.network.server: true
    settings:
      base:
        TEST_TARGET_NAME: ArktShell
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkt.ArktShellUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ArktShell:
    build:
      targets:
        ArktShell: all
    run:
      config: Debug
    profile:
      config: Profile
  ArktShellUITests:
    build:
      targets:
        ArktShell: all
        ArktShellUITests: [test]
    test:
      # The ARKT_* overrides exist only in Debug (and Profile) builds.
      config: Debug
      # Attachments (the automatic screenshots and the tests' own) are kept only for failures: the
      # plan sets both lifetimes to deleteOnSuccess (XcodeGen has no scheme key for them, issue #426).
      testPlans:
        - path: ArktShellUITests.xctestplan
          defaultPlan: true
