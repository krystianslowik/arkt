name: ArktShell
options:
  bundleIdPrefix: dev.arkt
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  # Release settings plus the scripted smoke (`-ArktSmoke YES`): optimized pacing runs. Never shipped.
  Profile: release
  # Embedding spike (engine week 2, Task WE): main.swift hands the process to Chromium's ChromeMain. Never shipped.
  Spike: debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    ARKT_PRINCIPAL_CLASS: NSApplication
    # Info.plist `ArktEnvironmentOverrides`: YES only where the build reads the ARKT_* environment overrides (Debug,
    # Profile); NO in Release, Spike and any new config. The UI test harness refuses to launch a bundle without YES.
    ARKT_ENV_OVERRIDES: "NO"
  configs:
    Debug:
      ARKT_ENV_OVERRIDES: "YES"
    Profile:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARKT_SMOKE_BUILD"
      ARKT_ENV_OVERRIDES: "YES"
    Spike:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARKT_CHROMIUM_SPIKE"
      # Chromium CHECKs that NSApp is a BrowserCrApplication (chrome_browser_application_mac.mm).
      ARKT_PRINCIPAL_CLASS: BrowserCrApplication
      ENABLE_HARDENED_RUNTIME: NO
      # Keep the Swift entry point in the main executable, like Chromium's stub, instead of
      # Xcode's debug stub plus ArktShell.debug.dylib.
      ENABLE_DEBUG_DYLIB: NO
packages:
  ShellKit:
    path: ShellKit
  ArktCore:
    path: ../ArktCore
targets:
  ArktShell:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Arkt Shell
        CFBundleDisplayName: Arkt Shell
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: $(ARKT_PRINCIPAL_CLASS)
        ArktEnvironmentOverrides: $(ARKT_ENV_OVERRIDES)
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkt.ArktShell
        PRODUCT_NAME: ArktShell
    dependencies:
      - package: ShellKit
        product: ShellUI
      - package: ShellKit
        product: FakeEngineKit
      - package: ShellKit
        product: EngineAPI
      - package: ShellKit
        product: CoreBridge
      - package: ArktCore
        product: Persistence      # composition root only: the one GRDB link
      - package: ArktCore
        product: SidebarModel
      - package: ArktCore
        product: Archive
      - package: ArktCore
        product: ArcImport
  # XCUITest suite (track U, docs/plans/2026-10-23-ui-tests.md). Drives the Debug ArktShell.app through
  # accessibility only; every launch uses a throwaway sandbox (UITests/Harness/Sandbox.swift).
  ArktShellUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: ArktShell
    settings:
      base:
        TEST_TARGET_NAME: ArktShell
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkt.ArktShellUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ArktShell:
    build:
      targets:
        ArktShell: all
    run:
      config: Debug
    profile:
      config: Profile
  ArktShellUITests:
    build:
      targets:
        ArktShell: all
        ArktShellUITests: [test]
    test:
      # The ARKT_* overrides exist only in Debug (and Profile) builds.
      config: Debug
      gatherCoverageData: false
      targets: [ArktShellUITests]
