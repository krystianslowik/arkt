name: ArktShell
options:
  bundleIdPrefix: dev.arkt
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  # Release settings plus the scripted smoke (`-ArktSmoke YES`): optimized pacing runs. Never shipped.
  Profile: release
  # Embedding spike (engine week 2, Task WE): main.swift hands the process to Chromium's ChromeMain. Never shipped.
  Spike: debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    ARKT_PRINCIPAL_CLASS: NSApplication
  configs:
    Profile:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARKT_SMOKE_BUILD"
    Spike:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARKT_CHROMIUM_SPIKE"
      # Chromium CHECKs that NSApp is a BrowserCrApplication (chrome_browser_application_mac.mm).
      ARKT_PRINCIPAL_CLASS: BrowserCrApplication
      ENABLE_HARDENED_RUNTIME: NO
      # Keep the Swift entry point in the main executable, like Chromium's stub, instead of
      # Xcode's debug stub plus ArktShell.debug.dylib.
      ENABLE_DEBUG_DYLIB: NO
packages:
  ShellKit:
    path: ShellKit
  ArktCore:
    path: ../ArktCore
targets:
  ArktShell:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Arkt Shell
        CFBundleDisplayName: Arkt Shell
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: $(ARKT_PRINCIPAL_CLASS)
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkt.ArktShell
        PRODUCT_NAME: ArktShell
    dependencies:
      - package: ShellKit
        product: ShellUI
      - package: ShellKit
        product: FakeEngineKit
      - package: ShellKit
        product: EngineAPI
      - package: ShellKit
        product: CoreBridge
      - package: ArktCore
        product: Persistence      # composition root only: the one GRDB link
      - package: ArktCore
        product: SidebarModel
      - package: ArktCore
        product: Archive
      - package: ArktCore
        product: ArcImport
schemes:
  ArktShell:
    build:
      targets:
        ArktShell: all
    run:
      config: Debug
    profile:
      config: Profile
