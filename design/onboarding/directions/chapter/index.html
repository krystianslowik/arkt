<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arkt first run: Chapter</title>
<link rel="stylesheet" href="../_shared/base.css">
<style>
  /* Chapter: every step is a chapter of arkt.dev. Copy holds a left column at the website's chapter scale; the
     formation owns the right of the window. A glass capsule, like the site's navbar, materializes after Welcome. */
  .bar { position: absolute; top: 12px; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; pointer-events: none; }
  .capsule { position: relative; width: 560px; display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 14px; border-radius: 999px; pointer-events: auto; }
  .capsule::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
    background: rgb(var(--bg-rgb) / 0.4); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4);
    box-shadow: inset 0 0 0 1px var(--line); opacity: 0; transform: translateZ(0) scale(0.97);
    transition: opacity 280ms var(--ease-out), transform 360ms var(--ease-out); }
  body:not([data-step="welcome"]) .capsule::before { opacity: 1; transform: translateZ(0) scale(1); }
  @media (prefers-reduced-transparency: reduce) { .capsule::before { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; } }
  .brand { display: flex; align-items: center; gap: 9px; opacity: 0; transform: translateX(-6px); transition: opacity 360ms var(--ease-out), transform 360ms var(--ease-out); }
  body:not([data-step="welcome"]) .brand { opacity: 1; transform: none; }
  .brand img { display: block; }
  .brand img.on-dark { display: none; }
  .brand .icon { width: 26px; height: 26px; }
  .brand .wordmark { width: 48px; height: auto; }
  .on-dark { display: none; }
  :root[data-theme="dark"] .brand img.on-dark { display: block; } :root[data-theme="dark"] .brand img.on-light { display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand img.on-dark { display: block; } :root:not([data-theme="light"]) .brand img.on-light { display: none; } }

  .col { position: absolute; z-index: 2; left: var(--gutter); top: 50%; width: 500px; transform: translateY(-50%); }
  .step { position: absolute; left: 0; top: 50%; width: 100%; transform: translateY(-50%); display: grid; gap: 24px; justify-items: start; }
  .welcome h1 { font-size: 86px; max-width: 6.2em; }
  .welcome .lede { max-width: 30ch; }
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .import h2 { font-size: 60px; max-width: 8em; }
  .import .lede { font-size: 18px; max-width: 34ch; }

  /* The live count, in the website's facts pattern: hairline rows, the name, the number */
  .facts { list-style: none; margin: 2px 0 0; padding: 0; width: 100%; max-width: 420px; display: grid; }
  .facts li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
  .facts li:last-child { border-bottom: 1px solid var(--line); }
  .facts b { font-size: 15px; font-weight: 600; }
  .facts .num { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; min-width: 2ch; text-align: right; transition: color 300ms ease; }
  .facts .num.counting { color: var(--muted); }
</style>
</head>
<body data-step="welcome">
<div class="stage" aria-hidden="true"><canvas id="stage"></canvas></div>
<div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bar">
  <div class="capsule">
    <span class="brand" aria-hidden="true">
      <img class="icon on-light" src="../../../brand/logos/01-mustard-on-white.png" alt="">
      <img class="icon on-dark" src="../../../brand/logos/02-mustard-on-graphite.png" alt="">
      <img class="wordmark on-light" src="../../../brand/logos/wordmark-graphite.png" alt="">
      <img class="wordmark on-dark" src="../../../brand/logos/wordmark-ivory.png" alt="">
    </span>
    <button class="quiet" id="skip" type="button">Skip setup</button>
  </div>
</header>

<main class="col">
  <section class="step welcome" data-step="welcome" aria-label="Welcome to Arkt">
    <h1 class="display" data-split>Make yourself at home.</h1>
    <p class="lede halo in" style="--d: 260">Arkt is a native macOS browser. A few choices, and each one can wait.</p>
    <div class="actions in" style="--d: 380"><button class="button" id="start" type="button" data-autofocus>Get started</button></div>
  </section>

  <section class="step import" data-step="import" aria-label="Bring your Arc setup">
    <p class="eyebrow in" style="--d: 0">Arc is on this Mac</p>
    <h2 class="title halo" data-split style="--base: 60ms">Bring your sidebar across.</h2>
    <p class="lede halo in" style="--d: 320">Arkt rebuilds it here, the way you left it. Arc stays as it is.</p>
    <ul class="facts in" style="--d: 420" aria-live="polite">
      <li><b>Spaces</b><span class="num" data-k="spaces">0</span></li>
      <li><b>Pinned tabs</b><span class="num" data-k="pinned">0</span></li>
      <li><b>Favorites</b><span class="num" data-k="favorites">0</span></li>
      <li><b>Folders</b><span class="num" data-k="folders">0</span></li>
    </ul>
    <div class="actions in" style="--d: 520">
      <button class="button" type="button" id="import" data-autofocus>Import from Arc</button>
      <button class="button ghost" type="button">Start fresh</button>
    </div>
  </section>
</main>

<script type="module">
  import { createField, imagePoints, roundRect, seeded, hex, SPRING, BRAND } from '../_shared/field.js';
  import { setup, splitWords, show, liveCount, ready, ARC, ARC_SPACES } from '../_shared/flow.js';

  const env = setup();
  splitWords();
  await document.fonts.load('600 40px "Avenir Next"');
  const field = createField(document.getElementById('stage'), { count: 16000, still: env.still, reduced: env.reduced });
  if (env.dark) field.ink = hex('#faf9f5');
  const { W, H } = field.size();
  const cx = W * 0.715;

  const MARK = await imagePoints('../../../brand/logos/01-mustard-on-white.png', 220, (r, g, b, a) => a > 200 && Math.max(r, g, b) - Math.min(r, g, b) > 70);
  const WORD = await imagePoints('../../../brand/logos/wordmark-graphite.png', 300);

  // The ambient field: the website's rising cloud, ink motes and sparse mustard sparks
  const ambient = (i, rnd, a = 1) => {
    const spark = rnd() > 0.86;
    return { x: rnd() * W, y: rnd() * H, a: (spark ? 0.7 : 0.22) * a, c: spark ? 'accent' : 'ink', s: 1 + rnd() * 1.6, drift: 10 + rnd() * 14, spring: SPRING.drift };
  };

  // Welcome: the mark, sampled from the approved artwork, with the wordmark beneath. A cloud gathers into it.
  function welcome(i, rnd) {
    const lane = i % 16;
    if (lane < 9) {
      const p = MARK[(rnd() * MARK.length) | 0]; const h = 300;
      const j = h / 190;
      return { x: cx + p.x * h + (rnd() - 0.5) * j * 1.6, y: H * 0.43 + p.y * h + (rnd() - 0.5) * j * 1.6, c: p.c, a: 1, s: 1.6 + rnd() * 1.6, drift: 1.2, delay: rnd() * 0.5 };
    }
    if (lane < 11) {
      const p = WORD[(rnd() * WORD.length) | 0]; const h = 54;
      return { x: cx + p.x * h, y: H * 0.79 + p.y * h, c: 'ink', a: 0.9, s: 1.1 + rnd() * 0.8, drift: 0.6, delay: 0.25 + rnd() * 0.5 };
    }
    return ambient(i, rnd);
  }

  // Import: Arc's sidebar data on the left streams in mustard into the rebuilt sidebar on the right.
  // Everything is drawn from the counts: four Space swatches, twelve Favorites, the pinned rows, four Space dots.
  const SB = { x: W * 0.83, top: H * 0.17, w: 214 };
  function sidebarPoint(rnd, part) {
    const left = SB.x - SB.w / 2;
    if (part < 0.12) { // Space swatches in their Arc theme colours
      const j = (rnd() * ARC.spaces) | 0, sw = (SB.w - 3 * 8) / 4;
      const [px, py] = roundRect(rnd, sw, 26, 7, rnd() < 0.55);
      const [a, b] = ARC_SPACES[j].map(hex), t = (px / sw + 0.5);
      return { x: left + sw / 2 + j * (sw + 8) + px, y: SB.top + 13 + py, c: a.map((v, n) => v + (b[n] - v) * t), a: 0.95 };
    }
    if (part < 0.42) { // Favorites: 4 x 3 tiles
      const j = (rnd() * ARC.favorites) | 0, col = j % 4, row = (j / 4) | 0, tw = (SB.w - 3 * 8) / 4;
      const edge = rnd() < 0.7;
      const [px, py] = roundRect(rnd, tw, 36, 8, edge);
      return { x: left + tw / 2 + col * (tw + 8) + px, y: SB.top + 64 + row * 44 + py, c: 'ink', a: edge ? 0.85 : 0.14 };
    }
    if (part < 0.46) { // Space title
      return { x: left + 6 + rnd() * 54, y: SB.top + 214 + (rnd() - 0.5) * 3, c: 'ink', a: 0.6 };
    }
    if (part < 0.94) { // Pinned rows: folders carry a square, tabs a dot
      const rows = 8, j = (rnd() * rows) | 0, y0 = SB.top + 244 + j * 30;
      const len = [150, 118, 170, 96, 136, 160, 104, 128][j], folder = j % 3 === 0;
      const u = rnd();
      if (u < 0.22) { const [px, py] = roundRect(rnd, 12, 12, folder ? 2 : 6, true); return { x: left + 12 + px, y: y0 + py, c: folder ? 'accent' : 'ink', a: 0.9 }; }
      return { x: left + 30 + rnd() * len, y: y0 + (rnd() - 0.5) * 6, c: 'ink', a: j === 1 ? 0.95 : 0.7 };
    }
    // Bottom bar: one dot per Space
    const j = (rnd() * ARC.spaces) | 0, a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 2.6;
    return { x: SB.x - 1.5 * 16 + j * 16 + Math.cos(a) * r, y: SB.top + 498 + Math.sin(a) * r, c: j === 0 ? 'ink' : 'ink', a: j === 0 ? 1 : 0.45 };
  }
  function importing(i, rnd) {
    const lane = i % 20;
    if (lane < 9) { const p = sidebarPoint(rnd, rnd()); return { ...p, s: 1.2 + rnd() * 1.1, drift: 0.8, delay: 0.25 + rnd() * 0.6, spring: SPRING.gather }; }
    if (lane < 12) { // Arc's rows, as data on the left
      const j = (rnd() * 15) | 0, len = 54 + ((j * 37) % 70);
      return { x: W * 0.505 + rnd() * len, y: H * 0.2 + j * 30 + (rnd() - 0.5) * 4, c: 'ink', a: 0.5, s: 1 + rnd() * 0.9, drift: 0.8, delay: rnd() * 0.3 };
    }
    if (lane < 15) { // The stream, mustard, between them
      // Each Arc row flows on its own curve to its place in the new sidebar
      const t = rnd(), j = (rnd() * 15) | 0;
      const y0 = H * 0.2 + j * 30, y1 = SB.top + 30 + j * 32;
      const e = t * t * (3 - 2 * t), x0 = W * 0.505 + 54 + ((j * 37) % 70) + 6, x1 = SB.x - SB.w / 2 - 14;
      const spread = 7 * Math.sin(Math.PI * t);
      return { x: x0 + t * (x1 - x0), y: y0 + (y1 - y0) * e + (rnd() - 0.5) * spread, c: 'accent', a: 0.85 * Math.pow(Math.sin(Math.PI * t), 0.6) + 0.05, s: 1 + rnd() * 1.4, drift: 2.5, delay: rnd() * 0.4 };
    }
    return ambient(i, rnd, 0.8);
  }

  const forms = { welcome, import: importing };
  function go(step) {
    show(step);
    field.form(forms[step]);
    if (step === 'import') {
      const els = Object.fromEntries([...document.querySelectorAll('.facts .num')].map((e) => [e.dataset.k, e]));
      liveCount(ARC, { still: env.still, onValue: (k, v, done) => { els[k].textContent = v; els[k].classList.toggle('counting', !done); } });
    }
  }
  document.getElementById('start').addEventListener('click', () => go('import'));
  addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') go('welcome'); });

  if (env.still) { go(env.step); field.renderStill(4); requestAnimationFrame(() => requestAnimationFrame(ready)); }
  else { field.start(); setTimeout(() => { go(env.step); ready(); }, 120); }
</script>
</body>
</html>
