<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arkt first run: Hero</title>
<link rel="stylesheet" href="../_shared/base.css">
<style>
  /* Hero: every step is the arkt.dev hero. One centred message over the field, and the numbers are the sculpture:
     the live count assembles from motes the way the countdown does, large number first, a smaller row beneath. */
  .col { position: absolute; inset: 0; z-index: 2; }
  .step { position: absolute; inset: 0; display: grid; justify-items: center; align-content: start; text-align: center; }

  .welcome { padding-top: 330px; }
  .mark-slot { position: absolute; left: 50%; top: 92px; width: 190px; height: 190px; margin-left: -95px; }
  .welcome h1 { font-size: 80px; }
  .welcome .lede { margin-top: 22px; color: var(--ink); font-size: 20px; }
  .welcome .actions { margin-top: 36px; }

  .import { padding-top: 70px; }
  .count { display: grid; justify-items: center; gap: 12px; margin-top: 18px; }
  .cd-num { display: block; font: 600 210px/0.86 var(--font); letter-spacing: -0.04em; color: transparent; min-width: 2.1ch; text-align: center; }
  .rest { display: flex; gap: 64px; }
  .rest .cd-num { font-size: 64px; }
  .group { display: grid; justify-items: center; gap: 10px; }
  .cd-label { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .big .cd-label { font-size: 13px; }
  .import h1 { margin-top: 34px; font-size: 54px; }
  .import .note { margin-top: 14px; font-size: 16px; color: var(--muted); }
  .actions { display: flex; justify-content: center; gap: 10px; }
  .import .actions { margin-top: 28px; }

  /* Wayfinding, the way the site's footer speaks: small, quiet, at the edge */
  .foot { position: absolute; z-index: 4; left: 26px; right: 26px; bottom: 18px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-size: 13px; color: var(--muted); }
  .foot .left { justify-self: start; }
  .foot .right { justify-self: end; }
  .foot .where { font-variant-numeric: tabular-nums; letter-spacing: 0.01em; transition: opacity 300ms ease; }
  body[data-step="welcome"] .foot .where, body[data-step="welcome"] .foot .left { opacity: 0; pointer-events: none; }
  html.no-field .cd-num { color: var(--ink); }
</style>
</head>
<body data-step="welcome">
<div class="stage" aria-hidden="true"><canvas id="stage"></canvas></div>
<div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="col">
  <section class="step welcome" data-step="welcome" aria-label="Welcome to Arkt">
    <div class="mark-slot" role="img" aria-label="Arkt"></div>
    <h1 class="display halo" data-split>Keep the way you browse.</h1>
    <p class="lede halo in" style="--d: 300">A native macOS browser.</p>
    <div class="actions in" style="--d: 420"><button class="button" id="start" type="button" data-autofocus>Get started</button></div>
  </section>

  <section class="step import" data-step="import" aria-label="Bring your Arc setup">
    <p class="eyebrow in" style="--d: 0">Found in Arc on this Mac</p>
    <div class="count" aria-live="polite">
      <div class="group big"><span class="cd-num num" data-k="pinned">37</span><span class="cd-label in" style="--d: 500">pinned tabs</span></div>
      <div class="rest">
        <div class="group"><span class="cd-num num" data-k="spaces">4</span><span class="cd-label in" style="--d: 560">Spaces</span></div>
        <div class="group"><span class="cd-num num" data-k="favorites">12</span><span class="cd-label in" style="--d: 600">Favorites</span></div>
        <div class="group"><span class="cd-num num" data-k="folders">9</span><span class="cd-label in" style="--d: 640">folders</span></div>
      </div>
    </div>
    <h1 class="display halo" data-split style="--base: 200ms">Bring it all across.</h1>
    <p class="note halo in" style="--d: 420">Arc stays as it is.</p>
    <div class="actions in" style="--d: 520">
      <button class="button ghost" type="button">Start fresh</button>
      <button class="button" type="button" data-autofocus>Import from Arc</button>
    </div>
  </section>
</main>

<footer class="foot">
  <button class="quiet left" type="button" id="back">Back</button>
  <span class="where halo">1 of 6</span>
  <button class="quiet right" type="button">Skip setup</button>
</footer>

<script type="module">
  import { createField, imagePoints, textPoints, foldPoint, project, hex, SPRING } from '../_shared/field.js';
  import { setup, splitWords, show, liveCount, ready, ARC } from '../_shared/flow.js';

  const env = setup();
  splitWords();
  await document.fonts.load('600 40px "Avenir Next"');
  const field = createField(document.getElementById('stage'), { count: 16000, still: env.still, reduced: env.reduced });
  if (env.dark) field.ink = hex('#faf9f5');
  const { W, H } = field.size();
  const MARK = await imagePoints('../../../brand/logos/01-mustard-on-white.png', 220, (r, g, b, a) => a > 200 && Math.max(r, g, b) - Math.min(r, g, b) > 70);

  // Lanes: 0-5 digits or mark, 6-7 the fold, the rest the ambient field
  const lane = (i) => i % 20;
  const isDigit = (i) => lane(i) < 9;

  // The brand fold sweeping along the bottom of the window, as under the website's hero
  const unit = H / 12.6;
  const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
  const centre = (t) => [-10.5 + 21 * t, -6.1 + 3.0 * smooth(0.4, 1.0, t) + 0.6 * Math.sin(Math.PI * t * 1.4), -1.2 + 1.6 * Math.sin(Math.PI * t)];
  const fold = (rnd) => { const { p, c } = foldPoint(rnd, centre, 0.42); const [x, y, f] = project(p, W / 2, H / 2, unit, 20); return { x, y, c, a: 0.95, s: (1.2 + rnd() * 1.8) * f, drift: 1.6 }; };
  const ambient = (rnd) => { const spark = rnd() > 0.85; return { x: rnd() * W, y: rnd() * H, a: spark ? 0.7 : 0.2, c: spark ? 'accent' : 'ink', s: 1 + rnd() * 1.7, drift: 12 + rnd() * 12, spring: SPRING.drift }; };

  // Digit slots read their place from the page, like the site's countdown
  const slots = [...document.querySelectorAll('.cd-num')].map((el) => ({ el, k: el.dataset.k, size: parseFloat(getComputedStyle(el).fontSize) }));
  const share = { pinned: 0.46, spaces: 0.18, favorites: 0.18, folders: 0.18 };
  const glyphs = new Map();
  const glyph = (text, px) => { const key = text + '@' + px; if (!glyphs.has(key)) glyphs.set(key, textPoints(text, px, 600, '"Avenir Next"', -0.04)); return glyphs.get(key); };
  const values = { ...ARC };
  function digitTarget(i, rnd) {
    let u = (i * 0.6180339) % 1, acc = 0, slot = slots[0];
    for (const s of slots) { acc += share[s.k]; if (u < acc) { slot = s; break; } }
    const r = slot.el.getBoundingClientRect();
    const g = glyph(String(values[slot.k]), slot.size);
    const p = g.pts[(rnd() * g.pts.length) | 0];
    const spark = rnd() > 0.88;
    return { x: r.left + r.width / 2 + p.x + (rnd() - 0.5) * 1.2, y: r.top + r.height / 2 + p.y + (rnd() - 0.5) * 1.2, c: spark ? 'accent' : 'ink', a: spark ? 0.95 : 0.9, s: 1.2 + rnd() * 1.6, drift: 0.8, spring: SPRING.firmSlow, delay: (p.x / 400 + 0.5) * 0.35 };
  }
  function markTarget(rnd) {
    const r = document.querySelector('.mark-slot').getBoundingClientRect(), h = r.height;
    const p = MARK[(rnd() * MARK.length) | 0], j = h / 190;
    return { x: r.left + r.width / 2 + p.x * h + (rnd() - 0.5) * j * 1.6, y: r.top + r.height / 2 + p.y * h + (rnd() - 0.5) * j * 1.6, c: p.c, a: 1, s: 1.3 + rnd() * 1.3, drift: 0.8, delay: rnd() * 0.6 };
  }
  const forms = {
    welcome: (i, rnd) => lane(i) < 9 ? markTarget(rnd) : lane(i) < 13 ? fold(rnd) : ambient(rnd),
    import: (i, rnd) => lane(i) < 9 ? digitTarget(i, rnd) : lane(i) < 13 ? fold(rnd) : ambient(rnd),
  };

  function go(step) {
    show(step);
    if (step === 'import') {
      Object.keys(values).forEach((k) => (values[k] = env.still ? ARC[k] : 0));
      field.form(forms.import);
      // Live count: each change re-forms only that number's motes, from where they are
      liveCount(ARC, { still: env.still, onValue: (k, v) => {
        values[k] = v;
        document.querySelector(`.cd-num[data-k="${k}"]`).textContent = v;
        field.form(forms.import, { only: isDigit, retarget: true });
      } });
    } else field.form(forms.welcome);
  }
  document.getElementById('start').addEventListener('click', () => go('import'));
  document.getElementById('back').addEventListener('click', () => go('welcome'));

  if (env.still) { go(env.step); field.renderStill(4); requestAnimationFrame(() => requestAnimationFrame(ready)); }
  else { field.start(); setTimeout(() => { go(env.step); ready(); }, 120); }
</script>
</body>
</html>
