<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arkt first run: Acts</title>
<link rel="stylesheet" href="../_shared/base.css">
<style>
  /* Acts: the whole first run is one pinned chapter, like "The feel" on arkt.dev. The steps are set as large words
     down the left; the current one is sharp and leans in, the rest wait soft and faded. That list is the wayfinding,
     so there are no dots and no Back/Next bar. The step's few words and controls sit under the list. */
  .col { position: absolute; z-index: 2; left: var(--gutter); top: 0; bottom: 0; width: 470px; display: grid; align-content: center; gap: 30px; }
  .acts { list-style: none; margin: 0; padding: 0; display: grid; font-size: 44px; font-weight: 600; line-height: 1.04; letter-spacing: -0.05em; }
  .acts button { justify-self: start; padding: 0; border: 0; background: none; font: inherit; letter-spacing: inherit; text-align: left; cursor: default;
    opacity: 0.16; filter: blur(1.5px); transform: none;
    transition: opacity 420ms var(--ease-out), filter 420ms var(--ease-out), transform 420ms var(--ease-out); }
  .acts button.done { opacity: 0.4; filter: none; cursor: pointer; }
  .acts button[aria-current="step"] { opacity: 1; filter: none; transform: translateX(10px); }
  @media (hover: hover) and (pointer: fine) { .acts button.done:hover { opacity: 0.7; } }
  @media (prefers-reduced-motion: reduce) { .acts button { transition: opacity 200ms ease; } .acts button[aria-current="step"] { transform: none; } }
  @media (prefers-contrast: more) { .acts button { opacity: 0.45; filter: none; } .acts button.done { opacity: 0.7; } }

  .slot { position: relative; height: 170px; margin-left: 10px; }
  .step { position: absolute; inset: 0 auto auto 0; width: 440px; display: grid; gap: 22px; justify-items: start; }
  .lede { font-size: 18px; max-width: 38ch; }
  .lede b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 10px; }

  .corner { position: absolute; z-index: 5; top: 10px; right: 14px; }
</style>
</head>
<body data-step="welcome">
<div class="stage" aria-hidden="true"><canvas id="stage"></canvas></div>
<div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
<button class="quiet corner" type="button">Skip setup</button>

<main class="col">
  <ol class="acts" aria-label="Setup">
    <li><button type="button" data-go="welcome">Hello.</button></li>
    <li><button type="button" data-go="import">Bring Arc over.</button></li>
    <li><button type="button">Pick a look.</button></li>
    <li><button type="button">Make it default.</button></li>
    <li><button type="button">Add extensions.</button></li>
    <li><button type="button">Learn the sidebar.</button></li>
    <li><button type="button">Start browsing.</button></li>
  </ol>

  <div class="slot">
    <section class="step" data-step="welcome" aria-label="Welcome to Arkt">
      <p class="lede halo in" style="--d: 120">Arkt is a native macOS browser. Every step here can wait.</p>
      <div class="actions in" style="--d: 220"><button class="button" id="start" type="button" data-autofocus>Get started</button></div>
    </section>
    <section class="step" data-step="import" aria-label="Bring your Arc setup">
      <p class="lede halo in" style="--d: 120" aria-live="polite">Arc on this Mac holds <b data-k="spaces">4</b> Spaces, <b data-k="pinned">37</b> pinned tabs, <b data-k="favorites">12</b> Favorites and <b data-k="folders">9</b> folders. Arc stays as it is.</p>
      <div class="actions in" style="--d: 220">
        <button class="button" type="button" data-autofocus>Import from Arc</button>
        <button class="button ghost" type="button">Start fresh</button>
      </div>
    </section>
  </div>
</main>

<script type="module">
  import { createField, roundRect, project, hex, SPRING, BRAND } from '../_shared/field.js';
  import { setup, show, liveCount, ready, ARC, ARC_SPACES } from '../_shared/flow.js';

  const env = setup();
  await document.fonts.load('600 40px "Avenir Next"');
  const field = createField(document.getElementById('stage'), { count: 16000, still: env.still, reduced: env.reduced });
  if (env.dark) field.ink = hex('#faf9f5');
  const { W, H } = field.size();
  const CX = W * 0.72, CY = H * 0.5;
  const mix = (a, b, t) => a.map((v, j) => v + (b[j] - v) * t);

  const ambient = (rnd) => { const spark = rnd() > 0.86; return { x: rnd() * W, y: rnd() * H, a: spark ? 0.65 : 0.18, c: spark ? 'accent' : 'ink', s: 1 + rnd() * 1.6, drift: 12 + rnd() * 12, spring: SPRING.drift }; };

  // Welcome: the brand fold closed on itself, a mustard band with one half twist, turning slowly in its halo
  function loop(rnd) {
    const u = rnd() * Math.PI * 2, edge = rnd() < 0.25;
    const v = edge ? (rnd() < 0.5 ? -1 : 1) * (0.9 + rnd() * 0.1) : rnd() * 2 - 1;
    const R = 2.2, w = 0.62;
    const r = R + v * w * Math.cos(u / 2);
    let p = [r * Math.cos(u), r * Math.sin(u), v * w * Math.sin(u / 2)];
    const tilt = 1.0, ry = 0.35; // lean the loop back, turn it a little
    p = [p[0], p[1] * Math.cos(tilt) - p[2] * Math.sin(tilt), p[1] * Math.sin(tilt) + p[2] * Math.cos(tilt)];
    p = [p[0] * Math.cos(ry) + p[2] * Math.sin(ry), p[1], -p[0] * Math.sin(ry) + p[2] * Math.cos(ry)];
    // Shade by which face of the band looks at us, like the fold artwork
    const nz = Math.cos(u / 2) * Math.cos(tilt);
    const col = nz < -0.1 ? mix(BRAND.fold, BRAND.shade, 0.3) : mix(mix(BRAND.shade, BRAND.mustard, 0.5 + 0.5 * nz), BRAND.highlight, edge ? 0.6 : 0);
    const [x, y, f] = project(p, CX, CY, 92, 9);
    return { x, y, c: col, a: 0.95, s: (1.2 + rnd() * 1.6) * f, drift: 1.2, delay: rnd() * 0.5 };
  }

  // Import: Arc's four Spaces as rooms on a slow carousel, each in its own theme colours, its pinned rows inside.
  // Rooms, rows and tiles all come from the counts.
  const ROWS = [12, 10, 9, 6];
  const RW = 118, RH = 236, GAP = 20;
  const rooms = ARC_SPACES.map(([a, b], j) => ({ a: hex(a), b: hex(b), dark: j === 2, k: j - 1.5 }));
  const light = [0.98, 0.976, 0.96], graphite = hex('#202321');
  function room(rnd) {
    const j = (rnd() * rooms.length) | 0, R = rooms[j];
    let u, v, c, a, s = 1.2 + rnd() * 1.3;
    const part = rnd();
    const fg = R.dark ? light : graphite;
    if (part < 0.2) { [u, v] = roundRect(rnd, RW, RH, 14, true); c = mix(R.a, R.b, v / RH + 0.5); a = 1; }
    else if (part < 0.66) { [u, v] = roundRect(rnd, RW - 2, RH - 2, 13, false); c = mix(R.a, R.b, 0.35 + 0.65 * ((u / RW + 0.5) * 0.35 + (v / RH + 0.5) * 0.65)); a = 1; s *= 1.15; }
    else if (part < 0.72) { // Favorites: three tiles across the top of the room
      const k = (rnd() * 3) | 0, tw = (RW - 24 - 12) / 3; const [px, py] = roundRect(rnd, tw, 24, 6, true);
      u = -RW / 2 + 12 + tw / 2 + k * (tw + 6) + px; v = -RH / 2 + 26 + py; c = fg; a = 0.6;
    } else { // Pinned rows, as many as the Space holds (up to what fits)
      const n = Math.min(ROWS[j], 9), k = (rnd() * n) | 0;
      u = -RW / 2 + 14 + rnd() * (40 + ((k * 7) % 5) * 11); v = -RH / 2 + 62 + k * 18 + (rnd() - 0.5) * 3;
      c = fg; a = k === 0 ? 0.95 : 0.7;
    }
    // A shallow fan: rooms side by side, the outer ones lower and turned a little, like cards in a hand
    const ang = R.k * 0.05, ox = CX + R.k * (RW + GAP), oy = CY + Math.abs(R.k) * Math.abs(R.k) * 10;
    const x = ox + u * Math.cos(ang) - v * Math.sin(ang), y = oy + u * Math.sin(ang) + v * Math.cos(ang);
    return { x, y, c, a, s, drift: 0.8, delay: 0.1 + j * 0.12 + rnd() * 0.35, spring: SPRING.gather };
  }

  const forms = {
    welcome: (i, rnd) => (i % 20 < 10 ? loop(rnd) : ambient(rnd)),
    import: (i, rnd) => (i % 20 < 11 ? room(rnd) : ambient(rnd)),
  };
  const order = ['welcome', 'import'];
  function go(step) {
    show(step);
    const idx = order.indexOf(step);
    document.querySelectorAll('.acts button').forEach((b, j) => {
      b.toggleAttribute('aria-current', j === idx); if (j === idx) b.setAttribute('aria-current', 'step');
      b.classList.toggle('done', j < idx);
      b.disabled = j > idx; b.tabIndex = j < idx ? 0 : -1;
    });
    field.form(forms[step]);
    if (step === 'import') {
      liveCount(ARC, { still: env.still, onValue: (k, v) => { document.querySelector(`.lede b[data-k="${k}"]`).textContent = v; } });
    }
  }
  document.getElementById('start').addEventListener('click', () => go('import'));
  document.querySelectorAll('.acts [data-go]').forEach((b) => b.addEventListener('click', () => b.classList.contains('done') && go(b.dataset.go)));

  if (env.still) { go(env.step); field.renderStill(4); requestAnimationFrame(() => requestAnimationFrame(ready)); }
  else { field.start(); setTimeout(() => { go(env.step); ready(); }, 120); }
</script>
</body>
</html>
