.stitle2 { text-align: center; font-weight: 600; padding-top: 16px; height: 84px; }
.sbody { padding: 0 20px; }
.sh { font-size: 12px; font-weight: 600; color: var(--text-2); padding: 14px 8px 6px; }

.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fill-hover); border-top-color: var(--text-2); }

  grip: '<svg width="8" height="12" viewBox="0 0 8 12" fill="currentColor"><circle cx="2" cy="2" r="1"/><circle cx="6" cy="2" r="1"/><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="2" cy="10" r="1"/><circle cx="6" cy="10" r="1"/></svg>',

const C = ['#E46A4B','#7C8A6A','#8E6CC4','#4F78B8','#D59A2B','#3B8F6B','#C2457A','#5A6B7D','#B07D4F','#2F6FD6','#9AA33A','#D2614F'];
const ico = (i, sz = 16) => `<b style="background:${C[i % C.length]};width:${sz}px;height:${sz}px"></b>`;

  return `<div class="sidebar"><div class="urlpill">${url}</div>${favsHtml}<div class="stitle">${space}</div>${pinned}<div class="sdiv"></div>${todayHead}<div class="srow newtab">${G.plus}<span>New Tab</span></div>${today}<div class="sbottom">${bottom}</div></div>`;

  const keys = Object.keys(STATES);
  function render() {
    const parts = location.hash.slice(1).split('&');
    const s = STATES[parts[0]] ? parts[0] : keys[0];
    document.documentElement.dataset.theme = parts.includes('dark') ? 'dark' : 'light';
    document.documentElement.classList.toggle('shot', parts.includes('shot'));
    document.documentElement.classList.toggle('rm', parts.includes('rm'));
    const flags = parts.slice(1).filter(p => p !== 'shot').join('&');
    const i = keys.indexOf(s);
    const nav = `<div class="nav"><a href="#${keys[(i - 1 + keys.length) % keys.length]}${flags ? '&' + flags : ''}">Prev</a><a href="#${keys[(i + 1) % keys.length]}${flags ? '&' + flags : ''}">Next</a><a href="#${s}${parts.includes('dark') ? '' : '&dark'}">Light/Dark</a><span>${s}</span></div>`;

}
/* Library window rail: one order everywhere (Downloads, History, Spaces, Boosts). Captures is not listed yet. */
const BOOST_G = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4.5h6M12 4.5h1M3 11.5h1M7 11.5h6"/><circle cx="10.5" cy="4.5" r="1.6"/><circle cx="5.5" cy="11.5" r="1.6"/></svg>';
const libRail = (on) => `<div class="rail" role="list" aria-label="Library">${[['Downloads', G.dl], ['History', G.clock], ['Spaces', G.spaces], ['Boosts', BOOST_G]].map(([t, g]) => `<div class="ritem ${t === on ? 'on' : ''}" role="listitem">${g}<span>${t}</span></div>`).join('')}</div>`;
/* Smallest window: 640 x 420, 150 pt sidebar */
const small = (html) => `<div class="smallwrap">${html}</div>`;
/* #637 Clear browsing data sheet, on the Settings window (Privacy, "Clear...").
   One compact sheet: a time range pop-up, four checkboxes with what each costs, a summary line that names the
   total, Clear Data (destructive: neutral pill, red title, never the Return default).
   States: default, alltime, clearing, nothing */
const settingsWin = (sheet) => `<div class="swin"><div class="lights"><i></i><i></i><i style="background:var(--fill-hover)"></i></div><div class="stitle2">Privacy and Security</div>
<div class="sbody"><div class="sh">Data</div><div class="listfield"><div class="srowx"><div><div>Let websites read your Space's theme colors</div></div><span class="switch"></span></div><div class="srowx"><div><div>Clear browsing data</div><div class="sub">History, cookies and cached files, for a time range.</div></div><span class="link red">Clear...</span></div></div>
<div class="sh">Site permissions</div><div class="listfield">${['Location', 'Camera', 'Microphone'].map(t => `<div class="srowx"><span>${t}</span><span class="popup">Ask ${G.chev}</span></div>`).join('')}</div></div>
<div class="sdim"></div>${sheet}</div>`;
const KINDS = (all) => [
  ['History', all ? '12,486 pages, including imported history' : '86 pages', true],
  ['Cookies and site data', all ? 'Signs you out of most sites' : 'From 14 sites. Keeps you signed in elsewhere', all],
  ['Cached images and files', all ? '1.9 GB' : '412 MB', true],
  ['Downloads list', 'The files stay in your folder', false],
];
const keep = `<div class="keep">${G.spaces}<span>Your Spaces, sidebar tabs and Archive stay as they are.</span></div>`;
const profile = `<span class="sub">Profile: Default</span>`;

const summary = (all, none) => none ? 'Nothing selected.' : all ? 'Removes 12,486 pages, cookies from 318 sites and 1.9 GB of cached files.' : 'Removes 86 pages and 412 MB of cached files.';
const aSheet = (all, busy, none) => `<div class="sheet csheet" style="width:440px"><h2>Clear browsing data</h2>
<div class="rangeRow"><span>Time range</span><span class="popup">${all ? 'All time' : 'Last hour'} ${G.chev}</span><span class="grow"></span>${profile}</div>
<div class="kinds">${KINDS(all).map(k => none ? [k[0], k[1], false] : k).map(k => `<div class="kind"><span class="chk ${k[2] ? 'on' : ''}">${k[2] ? G.check : ''}</span><div><div>${k[0]}</div><div class="sub ${all && k[0].startsWith('Cookies') ? 'warnc' : ''}">${k[1]}</div></div></div>`).join('')}</div>
<div class="sumline">${summary(all, none)}</div>
${keep}<div class="acts">${busy ? '<span class="spin"></span><span class="sub">Clearing...</span><span class="grow"></span><span class="btn" style="opacity:.5">Cancel</span><span class="btn destructive" style="opacity:.5">Clear Data</span>' : `<span class="btn">Cancel</span><span class="btn destructive" ${none ? 'style="opacity:.4" aria-disabled="true"' : ''}>Clear Data</span>`}</div></div>`;

const STATES = {
  'default': () => settingsWin(aSheet(false)), 'alltime': () => settingsWin(aSheet(true)), 'clearing': () => settingsWin(aSheet(true, true)), 'nothing': () => settingsWin(aSheet(false, false, true)),
};
const NOTES = {
  'default': 'Range pop-up, four kinds with their cost, and a summary line that updates with every choice. Clear Data is destructive: neutral pill, red title, no Return.',
  'alltime': 'All time with cookies: the cookie line says it signs you out; the summary names the full cost. History counts include imported history.',
  'clearing': 'Clearing: controls dim, a spinner; the sheet closes on finish and Settings shows "Cleared just now".',
  'nothing': 'Nothing checked: the summary says so and Clear Data is disabled.',
};
boot(STATES, NOTES);
</script></body></html>
