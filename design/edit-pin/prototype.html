<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

:root {

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desktop); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;

.page i.img { height: 150px; border-radius: 10px; margin: 26px 0; }
.dimmer { position: absolute; inset: 0; background: var(--dim); z-index: 4; }

.btn.primary { background: var(--accent); color: var(--on-accent); }

.btn.focus, .field.focus { box-shadow: 0 0 0 3.5px var(--focus); }

.listfield { background: var(--list-field); border-radius: 10px; padding: 4px; }

.chk { width: 16px; height: 16px; border-radius: 5px; flex: none; background: var(--fill-hover); display: grid; place-items: center; }
.chk.on { background: var(--text); color: var(--surface); }
.switch { width: 32px; height: 20px; border-radius: 10px; background: var(--fill-hover); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }

:root[data-theme="dark"] .switch.on::after { background: #202321; }

.toast .g { width: 16px; height: 16px; color: var(--toast-text-2); flex: none; }
.toast .act { font-size: 12px; font-weight: 600; padding: 0 12px; height: 24px; line-height: 24px; border-radius: 12px; background: var(--fill-hover); }
.toast .act.primary { background: var(--accent); color: var(--on-accent); }
.toast .x { width: 24px; height: 24px; display: grid; place-items: center; color: var(--toast-text-2); }
/* Annotation (prototype only): a caption under the window naming the frame */
.note { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11px; color: rgba(0,0,0,0.55); letter-spacing: 0.01em; }
:root[data-theme="dark"] .note { color: rgba(255,255,255,0.55); }
.nav { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; font-size: 11px; z-index: 99; }
.nav a { padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,0.08); color: inherit; text-decoration: none; }
.shot .nav { display: none; }
.fav.ring { background: var(--fill-hover); }
.field .sel, .field .u { overflow: hidden; text-overflow: clip; white-space: nowrap; }
.field.bad { box-shadow: 0 0 0 1px var(--destructive); }
.hint { font-size: 11px; color: var(--text-2); margin-top: 5px; display: flex; gap: 5px; align-items: center; }
.hint.err { color: var(--destructive); }
.pnotch { position: absolute; top: -6px; width: 12px; height: 12px; background: inherit; transform: rotate(45deg); border-radius: 2px; }
.pop { position: absolute; z-index: 6; width: 320px; padding: 16px; border-radius: 12px; background: var(--surface); box-shadow: var(--overlay-shadow); }
.pop .pnotch { top: 16px; left: -6px; }
.pop.below .pnotch { top: -6px; }
.pop h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
.pop label { display: block; font-size: 11px; font-weight: 600; color: var(--text-2); margin: 10px 0 4px; }
.pop .acts { margin-top: 16px; }

};
const C = ['#E46A4B','#7C8A6A','#8E6CC4','#4F78B8','#D59A2B','#3B8F6B','#C2457A','#5A6B7D','#B07D4F','#2F6FD6','#9AA33A','#D2614F'];
const ico = (i, sz = 16) => `<b style="background:${C[i % C.length]};width:${sz}px;height:${sz}px"></b>`;
const tile = (letter, i, sz = 20) => `<span style="width:${sz}px;height:${sz}px;border-radius:5px;background:${C[i % C.length]};color:#fff;font-size:${Math.round(sz*0.55)}px;font-weight:700;display:grid;place-items:center;flex:none">${letter}</span>`;

  const keys = Object.keys(STATES);
  function render() {

    const i = keys.indexOf(s);

  return `<div class="pop" role="dialog" aria-label="${fav ? 'Edit Favorite' : 'Edit Pinned Tab'}" style="left:${x}px;top:${y}px"><span class="pnotch" style="left:${notchX}px"></span>

  <label>Name</label><div class="field ${fav ? 'focus' : ''}">${fav ? `<span class="sel">${name}</span><span class="caret"></span>` : name}</div>
  <label>Pinned URL</label><div class="field ${fav ? '' : 'focus'} ${err ? 'bad' : ''}"><span class="u">${fav ? 'calendar.example.com/team/week' : `<span class="sel">${url}</span><span class="caret"></span>`}</span></div>
  ${err ? `<div class="hint err">${G.warn}<span>Enter a web address, like example.com</span></div>` : ''}
  <div class="acts"><span class="link">Use Current Page</span><span class="grow"></span><span class="btn">Cancel</span><span class="btn primary">Save</span></div></div>`;
}
const url = (err) => browser({ side: side({ pinned: pinnedPlain(0) }), over: popover({ x: 196, y: 160, name: 'Q4 planning', url: err ? BAD : LONG, err, notchX: 0 }) });
const fav = () => browser({ side: side({ favsHtml: favTiles(2), pinned: pinnedPlain() }), over: popover({ x: 40, y: 140, name: 'Team calendar', fav: true, notchX: 83 }).replace('class="pop"', 'class="pop below"') });

const STATES = { 'url': () => url(false), 'fav': fav, 'invalid': () => url(true) };
const NOTES = {
  'url': 'Edit Pinned URL: the popover anchors to the row; the URL field is focused and selected. The longest URL scrolls in the field.',
  'fav': 'Rename on a Favorite: the same popover from the tile, with the Name field focused. The name shows when you point at the tile.',
  'invalid': 'Not a web address: Save stays enabled; Save or Return shows the reason under the field and keeps the popover open.',
};
boot(STATES, NOTES);
</script></body></html>
