const PINNED = ['Q4 planning', 'Design review notes', 'Inbox'];
const TODAY = ['Field guide to lichens', 'Release checklist', 'Weekend recipes', 'Trail map, north ridge', 'Sourdough starter ratios'];
function sidebar({ url = 'fieldguide.example', favsHtml = favs(), pinned = PINNED.map((t, i) => row(t, i + 3)).join(''), todayHead = '', today = TODAY.map((t, i) => row(t, i, i === 0 ? 'cur' : '')).join(''), bottom = '<i></i><i class="on"></i><i></i>', space = 'Work' } = {}) {
  return `<div class="sidebar"><div class="urlpill">${url}</div>${favsHtml}<div class="stitle">${space}</div>${pinned}<div class="sdiv"></div>${todayHead}<div class="srow newtab">${G.plus}<span>New Tab</span></div>${today}<div class="sbottom">${bottom}</div></div>`;
}
function browser({ side = sidebar(), card = page(), over = '', dim = false } = {}) {
  return `<div class="win"><div class="lights"><i></i><i></i><i></i></div>${side}<div class="card">${card}</div>${dim ? '<div class="dimmer"></div>' : ''}${over}</div>`;
}
function toast(text, act = '', glyph = G.archive) {
  return `<div class="toast-host"><div class="toast" role="status"><span class="g">${glyph}</span><span>${text}</span>${act}<span class="x">${G.x}</span></div></div>`;
}
function boot(STATES, NOTES = {}) {
  const keys = Object.keys(STATES);
  function render() {
    const parts = location.hash.slice(1).split('&');
    const s = STATES[parts[0]] ? parts[0] : keys[0];
    document.documentElement.dataset.theme = parts.includes('dark') ? 'dark' : 'light';
    document.documentElement.classList.toggle('shot', parts.includes('shot'));
    document.documentElement.classList.toggle('rm', parts.includes('rm'));
    const flags = parts.slice(1).filter(p => p !== 'shot').join('&');
    const i = keys.indexOf(s);
    const nav = `<div class="nav"><a href="#${keys[(i - 1 + keys.length) % keys.length]}${flags ? '&' + flags : ''}">Prev</a><a href="#${keys[(i + 1) % keys.length]}${flags ? '&' + flags : ''}">Next</a><a href="#${s}${parts.includes('dark') ? '' : '&dark'}">Light/Dark</a><span>${s}</span></div>`;
    document.body.innerHTML = nav + STATES[s]() + (NOTES[s] ? `<div class="note">${NOTES[s]}</div>` : '');
  }
  addEventListener('hashchange', render);
  render();
}
/* Library window rail: one order everywhere (Downloads, History, Spaces, Boosts). Captures is not listed yet. */
const BOOST_G = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4.5h6M12 4.5h1M3 11.5h1M7 11.5h6"/><circle cx="10.5" cy="4.5" r="1.6"/><circle cx="5.5" cy="11.5" r="1.6"/></svg>';
const libRail = (on) => `<div class="rail" role="list" aria-label="Library">${[['Downloads', G.dl], ['History', G.clock], ['Spaces', G.spaces], ['Boosts', BOOST_G]].map(([t, g]) => `<div class="ritem ${t === on ? 'on' : ''}" role="listitem">${g}<span>${t}</span></div>`).join('')}</div>`;
/* Smallest window: 640 x 420, 150 pt sidebar */
const small = (html) => `<div class="smallwrap">${html}</div>`;
/* #631 Library: the History section.
   One list grouped by day, like the Downloads list. Imported visits merge in by date with no per-row mark; a "Show"
   pop-up filters by source (All history, This Mac, Imported). Each day header carries "Delete Day..." on hover.
   States: default, filter, search, delete-day, empty */
const V = [
  ['Field guide to lichens: crustose, foliose and fruticose forms', 'fieldguide.example', '18:42', 0],
  ['Pull request 4821: rework the sidebar outline diffing for very large Spaces with thousands of rows', 'code.example.org', '18:30', 3],
  ['Search results for lichen identification key', 'search.example', '18:29', 9],
  ['Release checklist', 'docs.example', '17:05', 1],
  ['Untitled', 'localhost:5173', '16:51', 7],
  ['Weekend recipes: sourdough, starter ratios and a long autolyse', 'kitchen.example', '12:14', 2],
];
const Y = [
  ['Trail map, north ridge', 'maps.example', '21:10', 5],
  ['Quarterly report Q3, final draft (shared)', 'docs.example', '15:02', 1],
  ['Museum tickets for March', 'tickets.example', '09:47', 4],
];
const libWin = (content, { title = 'Library', search = '', rail = true } = {}) => `<div class="behind">${browser()}</div>
<div class="lib"><div class="lights"><i></i><i></i><i></i></div><div class="lhead"><span class="ltitle">${title}</span><span class="grow"></span><div class="lsearch">${G.search}${search ? `<span>${search}</span><span class="caret"></span>` : '<span class="ph">Search history</span>'}</div></div>
${rail ? libRail('History') : ''}<div class="lbody ${rail ? '' : 'norail'}">${content}</div></div>`;
const vrow = (v, cls = '', hl = '') => `<div class="vrow ${cls}">${tile(v[0][0], v[3], 22)}<div class="vt"><div class="t">${hl ? v[0].replace(hl, `<mark>${hl}</mark>`) : v[0]}</div><div class="h">${v[1]}</div></div><span class="tm">${v[2]}</span>${cls.includes('on') ? '<span class="btn small primary">Open</span>' : ''}</div>`;
const dayHead = (d, sub, hover) => `<div class="day ${hover ? 'hov' : ''}">${d}<span>${sub}</span>${hover ? '<span class="grow"></span><span class="link red dd" role="button" aria-label="Delete ' + d + '">Delete Day...</span>' : ''}</div>`;
const foot = (l = 'Clear browsing data...', n = '12,486 visits') => `<div class="lfoot"><span class="link">${l}</span><span class="grow"></span><span class="sub">${n}</span></div>`;
const empty = (msg, sub) => `<div class="empty"><div class="etile">${G.clock}</div><div class="et">${msg}</div><div class="es">${sub}</div></div>`;

const listDays = (hoverToday = false, sel = 1) => `<div class="lscroll">${dayHead('Today', 'Thursday 5 November', hoverToday)}${V.map((v, i) => vrow(v, i === sel ? 'on' : '')).join('')}${dayHead('Yesterday', 'Wednesday 4 November')}${Y.map(v => vrow(v)).join('')}</div>`;
const filt = (open) => `<div class="filt"><span class="popup" role="button" aria-label="Show: All history">Show: All history ${G.chev}</span>${open ? `<div class="menu" role="menu"><div class="mi on">${G.check}<span>All history</span></div><div class="mi"><i></i><span>This Mac</span></div><div class="mi"><i></i><span>Imported</span><span class="sub">8,204</span></div></div>` : ''}</div>`;
const aDefault = () => libWin(filt(false) + listDays() + foot());
const aFilter = () => libWin(filt(true) + listDays() + foot());
const aDelete = () => libWin(filt(false) + listDays(true, -1) + foot()) + `<div class="ddsheet"><div class="sheet" style="width:360px;position:relative" role="alertdialog" aria-label="Delete Today's history?"><h2>Delete Today's history?</h2><p class="sec">212 pages visited on Thursday 5 November are removed from History. Your Spaces, sidebar tabs and Archive stay as they are.</p><div class="acts"><span class="btn">Cancel</span><span class="btn destructive">Delete Day</span></div></div></div>`;
const aSearch = () => libWin(`<div class="filt"><span class="popup">Show: All history ${G.chev}</span><span class="sub">3 results</span></div>
<div class="lscroll"><div class="day">Today</div>${[V[0], V[2]].map((v, i) => vrow(v, i === 0 ? 'on' : '', 'lichen')).join('')}<div class="day">12 October</div>${vrow(['Lichens of the north coast (imported)', 'flora.example', '10:02', 6], '', 'Lichen')}</div>${foot()}`, { search: 'lichen' });
const aEmpty = () => libWin(empty('No history yet', 'Pages you visit will be listed here.') + foot(''), {});

const W = [
  ['Pull request 48210: rework the sidebar outline diffing for very large Spaces with thousands of rows and nested folders', 'code.example.org', '23:59', 3],
  ['xn--80ak6aa92e.example: a page whose title is one unbroken word Pneumonoultramicroscopicsilicovolcanoconiosis', 'xn--80ak6aa92e.example', '23:58', 8],
  ['Untitled', 'localhost:5173', '23:41', 7],
];
const aWorst = () => libWin(`<div class="filt"><span class="popup">Show: All history ${G.chev}</span></div>
<div class="lscroll">${dayHead('Today', '9,999+ pages')}${W.map((v, i) => vrow(v, i === 0 ? 'on' : '')).join('')}${dayHead('Yesterday', '4,812 pages')}${vrow(W[1])}${dayHead('Tuesday 3 November', '3,107 pages')}${vrow(V[3])}${dayHead('Monday 2 November', '2,950 pages')}${vrow(V[4])}${dayHead('Sunday 1 November', '1,844 pages')}${vrow(Y[0])}</div>${foot(undefined, '1,284,113 visits')}`);
const aSmall = () => small(libWin(filt(false) + listDays() + foot()));
const STATES = { 'default': aDefault, 'filter': aFilter, 'search': aSearch, 'delete-day': aDelete, 'empty': aEmpty, 'worst': aWorst, 'small': aSmall };
const NOTES = {
  'default': 'One list by day, as Downloads. Imported visits merge in by date; the selected row shows Open.',
  'filter': 'The Show pop-up filters by source: All history, This Mac, Imported (with its count).',
  'search': 'Search matches titles and addresses across all days, imported included. Matches are tinted with a 35 % mustard fill.',
  'delete-day': 'Pointer over a day header: Delete Day... at its trailing end. It asks first; Delete Day is destructive, never the Return default.',
  'empty': 'Empty: a fresh profile, or after clearing.',
  'worst': 'Worst case: titles with no break points, a punycode host, 9,999+ pages in a day, many days, 1,284,113 visits.',
  'small': 'Smallest Library window (640 x 420, 150 pt rail): titles truncate first; times and Open never move.',
};
boot(STATES, NOTES);
</script></body></html>
