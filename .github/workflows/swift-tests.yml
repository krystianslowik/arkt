# Swift tests for the two packages and a Debug build of the app against the FakeEngine.
# Chromium is never built here (hours and over 100 GB); engine changes are verified locally (CONTRIBUTING, section 12).
# The check to require on main is "Swift tests" (the gate job at the end).
#
# Only the jobs a change needs run (CONTRIBUTING, section 12): the "Changes" job diffs the change and the macOS jobs
# skip themselves when none of their inputs changed. Hosted macOS runners are capped at 5 at once, so every skipped
# macOS job shortens the queue for everyone. The UI tests run nightly and by hand, never on a pull request.
name: Swift tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly on main: every job, including the UI tests and the GUI tests.
    - cron: "23 2 * * *"
  workflow_dispatch:

# A newer push cancels the run it supersedes, on a pull request and on main. A cancelled main run leaves its areas
# untested on main until the next push that touches them; the nightly run covers everything. Nightly and manual runs
# have their own group so they never cancel, or get cancelled by, a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Swift 6.2+ is required (`@concurrent`); 26.6 is the default Xcode on the macos-26 image.
  XCODE_VERSION: "26.6"
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

defaults:
  run:
    shell: zsh -eo pipefail {0}

jobs:
  # Which areas the change touched, and from them which jobs run. Pull request: the merge commit against its first
  # parent, the base tip (the pull request's own changes, not what main gained since it branched). Push to main: the
  # pushed range. Nightly and manual runs run everything.
  #   core   app/ArktCore
  #   shell  app/ArktShell/ShellKit (ChromiumEngineKit and ArktEngineABI live here too)
  #   app    the rest of app/ArktShell: App, project.yml, Engine.xcconfig, UITests
  #   engine engine/ (EngineABIIsolationTests compares engine/arkt/api/arkt_engine.h with ShellKit's copy)
  #   design design/ (BrandTokensTests reads design/brand/tokens/brand-tokens.json)
  #   ci     .github/ (a workflow change runs every required job once)
  # Anything else (docs/, README.md, CONTRIBUTING.md, scripts/) is docs only: no macOS job. scripts/ is covered by the
  # lint job, which always runs.
  # ShellKit depends on ArktCore (Package.swift), and its IsolationTests read every Swift file under app/ArktShell, so
  # app changes run the ShellKit tests too.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.areas.outputs.core }}
      shellkit: ${{ steps.areas.outputs.shellkit }}
      app: ${{ steps.areas.outputs.app }}
      gui: ${{ steps.areas.outputs.gui }}
      ui: ${{ steps.areas.outputs.ui }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Changed areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          core=false shell=false app=false engine=false design=false ci=false all=false
          case $EVENT in
            pull_request)
              files=$(git diff --name-only --no-renames HEAD^1 HEAD) || all=true ;;
            push)
              # A new branch or a range not reachable within the fetch depth: run everything.
              if [[ $BEFORE =~ ^0+$ ]] || ! git fetch --no-tags --depth=1 origin "$BEFORE" \
                || ! files=$(git diff --name-only --no-renames "$BEFORE" HEAD); then
                all=true
              fi ;;
            *) all=true ;;
          esac
          if [[ $all == false ]]; then
            echo "Changed files:"
            echo "${files:-(none)}"
            while IFS= read -r f; do
              case $f in
                app/ArktCore/*) core=true ;;
                app/ArktShell/ShellKit/*) shell=true ;;
                app/ArktShell/*) app=true ;;
                engine/*) engine=true ;;
                design/*) design=true ;;
                .github/*) ci=true ;;
              esac
            done <<< "${files:-}"
          fi
          any() { for a in "$@"; do [[ $a == true ]] && { echo true; return; }; done; echo false; }
          {
            echo "core=$(any $all $core $ci)"
            echo "shellkit=$(any $all $shell $core $app $engine $design $ci)"
            echo "app=$(any $all $app $shell $core $ci)"
            # Informative jobs: GUI tests on pull requests that touch the shell or the app, both on nightly and manual
            # runs. Push runs on main run the required jobs alone.
            case $EVENT in
              pull_request) echo "gui=$(any $shell $app $ci)"; echo "ui=false" ;;
              push) echo "gui=false"; echo "ui=false" ;;
              *) echo "gui=true"; echo "ui=true" ;;
            esac
          } | tee -a "$GITHUB_OUTPUT"
          echo "Areas: core=$core shell=$shell app=$app engine=$engine design=$design ci=$ci all=$all"

  # Source-only checks, cheap enough to run on every change, on Linux so they never wait for a macOS runner.
  isolation:
    name: Isolation greps and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install zsh
        shell: bash
        run: |
          command -v zsh && exit 0
          sudo apt-get install -y -qq --no-install-recommends zsh \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fast source-only mirror of IsolationTests (CoreIsolationTests, WebKitIsolationTests), so a layering break
      # fails in seconds with the offending lines. The Swift tests stay the authoritative gate.
      - name: Check import layering
        run: |
          pre='^[[:space:]]*(@[A-Za-z_]+(\([^)]*\))?[[:space:]]+)*((public|package|internal|fileprivate|private)[[:space:]]+)?import[[:space:]]+([a-z]+[[:space:]]+)?'
          end='([^A-Za-z0-9_]|$)'
          imports() { grep -rEn --include='*.swift' --exclude-dir=.build --exclude-dir=build "${pre}($1)${end}" "${@:2}" || true; }
          failed=0
          webkit=$(imports 'WebKit' app | grep -v '^app/ArktShell/ShellKit/Sources/FakeEngineKit/FakeEngine.swift:' || true)
          if [[ -n $webkit ]]; then
            print "::error::Only FakeEngineKit/FakeEngine.swift may import WebKit:"; print -r -- $webkit; failed=1
          fi
          grdb=$(imports 'Persistence|GRDB' app/ArktShell/ShellKit/Sources)
          if [[ -n $grdb ]]; then
            print "::error::ShellKit sources must not import Persistence or GRDB:"; print -r -- $grdb; failed=1
          fi
          persistence=$(imports 'Persistence' app/ArktShell \
            | grep -v -e '^app/ArktShell/App/' -e '^app/ArktShell/ShellKit/Tests/IsolationTests/' || true)
          if [[ -n $persistence ]]; then
            print "::error::Only the app target (app/ArktShell/App) may import Persistence:"; print -r -- $persistence; failed=1
          fi
          ui=$(imports 'SidebarModel|Archive|ArcImport|Persistence|GRDB' app/ArktShell/ShellKit/Sources/ShellUI)
          if [[ -n $ui ]]; then
            print "::error::ShellUI must not import ArktCore modules or GRDB:"; print -r -- $ui; failed=1
          fi
          (( failed == 0 )) && print "Import layering OK"
          exit $failed
      # Moved here from the UI tests job so it still runs on every pull request (plan, Rules "No sleeps" and
      # "No network"): no file under
      # app/ArktShell/UITests waits on time or names an http(s) URL other than the loopback fixture server
      # (http://127.0.0.1) and the Arc fixture placeholder (https://example.com, only in Harness/ArcFixture.swift,
      # which rewrites it to the loopback server). Each grep succeeds only when it prints an offending line.
      - name: Check UI test sources
        working-directory: app/ArktShell/UITests
        run: |
          failed=0
          if grep -rnE 'sleep\(|usleep\(|Thread\.sleep|Task\.sleep' .; then
            print -r -- "Sleeps in UI tests above (wait on accessibility state instead)"
            failed=1
          fi
          if grep -rnoE 'https?://[^[:space:]"'\''<>()\\`]*' . \
            | grep -vE '^[^:]+:[0-9]+:http://127\.0\.0\.1([:/]|$)' \
            | grep -vE '^\./Harness/ArcFixture\.swift:[0-9]+:https://example\.com([:/]|$)' \
            | grep -vE '^\./Harness/FixtureServer\.swift:[0-9]+:http://localhost:$'; then
            # FixtureServer's cross-site page links to `localhost` on its own port: loopback, another host (#348).
            print -r -- "URLs other than http://127.0.0.1 in UI tests above (the network is never touched)"
            failed=1
          fi
          (( failed )) && exit 1
          print "UI test sources OK"
      # The report script against synthetic fixtures, with a stub xcrun: classification, partial deferral, issue
      # source, repetitions, unknown row ids, xcresulttool errors and jq from PATH.
      - name: Parity report script tests
        run: scripts/ui-tests/parity-report-test.sh

  arktcore:
    name: ArktCore tests
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - run: swift --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/ArktCore/.build
          key: arktcore-build-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('app/ArktCore/Package.resolved') }}
          restore-keys: arktcore-build-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-
      - name: swift test
        working-directory: app/ArktCore
        run: swift test

  shellkit:
    name: ShellKit tests
    needs: changes
    if: needs.changes.outputs.shellkit == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/ArktShell/ShellKit/.build
          key: shellkit-build-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('app/ArktShell/ShellKit/Package.resolved') }}
          restore-keys: shellkit-build-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-
      - name: swift test (pure, no windows)
        working-directory: app/ArktShell/ShellKit
        run: swift test --skip ShellKitGUITests

  # Hosted macOS runners have a window server, so the GUI tests can open windows, but the display is a 60 Hz virtual
  # one and the machine is shared (1-minute load far above its 3 cores). The frame-timing gates (command bar
  # latency, Space swipe pacing) and the two tests that catch a Space settle mid-flight skip themselves as
  # NOT-MEASURABLE there, the same rule as the app's SmokeRunner (screen below 120 Hz or load at or above the core
  # count); on a developer machine they assert (CONTRIBUTING, section 7). Results are informative, not required.
  shellkit-gui:
    name: ShellKit GUI tests (informative)
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      # Restore only: the shellkit job saves this key, a second save from here would only fail with "already exists".
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/ArktShell/ShellKit/.build
          key: shellkit-build-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('app/ArktShell/ShellKit/Package.resolved') }}
          restore-keys: shellkit-build-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-
      - name: GUI tests
        working-directory: app/ArktShell/ShellKit
        run: swift test --filter 'ShellKitGUITests.(CommandBarTests|FakeEngineDownloadContractTests|SplitDragTests)/'

  app:
    name: App build (Debug)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          dir=$RUNNER_TEMP/xcodegen
          mkdir -p $dir
          curl -fsSL -o $dir/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          print "$XCODEGEN_SHA256  $dir/xcodegen.zip" | shasum -a 256 -c -
          unzip -q $dir/xcodegen.zip -d $dir
          print "$dir/xcodegen/bin" >> $GITHUB_PATH
      # Package checkouts only. A DerivedData cache was measured (#431): the Debug build went from 76 s to 45 s, for
      # 436 MB per commit, which would push the SwiftPM caches out of the repository's 10 GB cache quota.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/ArktShell/build/SourcePackages
          key: app-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/ArktCore/Package.resolved', 'app/ArktShell/ShellKit/Package.resolved') }}
          restore-keys: app-spm-${{ runner.os }}-${{ runner.arch }}-
      - name: xcodegen generate
        working-directory: app/ArktShell
        run: xcodegen --version && xcodegen generate
      - name: xcodebuild Debug
        working-directory: app/ArktShell
        run: |
          xcodebuild -project ArktShell.xcodeproj -scheme ArktShell -configuration Debug \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO build

  # XCUITest suite against the Debug app with the FakeEngine. Informative until promoted (UI test plan, decision 8):
  # not in the gate's needs. Nightly on main and by hand only (about 20 minutes of a macOS runner); its source lint
  # runs in the isolation job on every change. The runner needs the ad-hoc signature, so no CODE_SIGNING_ALLOWED=NO here.
  ui-tests:
    name: UI tests (informative)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          dir=$RUNNER_TEMP/xcodegen
          mkdir -p $dir
          curl -fsSL -o $dir/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          print "$XCODEGEN_SHA256  $dir/xcodegen.zip" | shasum -a 256 -c -
          unzip -q $dir/xcodegen.zip -d $dir
          print "$dir/xcodegen/bin" >> $GITHUB_PATH
      # Restore only: the app job saves this key, a second save from here would only fail with "already exists".
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/ArktShell/build/SourcePackages
          key: app-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/ArktCore/Package.resolved', 'app/ArktShell/ShellKit/Package.resolved') }}
          restore-keys: app-spm-${{ runner.os }}-${{ runner.arch }}-
      - name: xcodegen generate
        working-directory: app/ArktShell
        run: xcodegen --version && xcodegen generate
      - name: xcodebuild test
        working-directory: app/ArktShell
        # TEST_RUNNER_* values reach the test runner only through the process environment, not as build settings.
        env:
          TEST_RUNNER_ARKT_UITEST_TIMEOUT_SCALE: "3"
        run: |
          xcodebuild -project ArktShell.xcodeproj -scheme ArktShellUITests -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages -resultBundlePath $RUNNER_TEMP/ui.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never test
      # Runs after a failed test step too. Failing rows do not fail the script; malformed input does, including a test
      # name that cites a row id missing from the spec (the report is still written first). The report goes to the
      # job summary, the artifact and the job log.
      - name: Parity report
        if: ${{ !cancelled() }}
        run: |
          scripts/ui-tests/parity-report.sh \
            $RUNNER_TEMP/ui.xcresult \
            docs/spec/arc-parity-spec.md \
            app/ArktShell/UITests/parity-deferred.txt \
            | tee $RUNNER_TEMP/parity-report.md | tee -a $GITHUB_STEP_SUMMARY
      - name: Upload the result bundle and parity report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-xcresult
          path: |
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/parity-report.md
          retention-days: 7
          if-no-files-found: ignore
      - name: Export failure attachments
        if: ${{ failure() }}
        run: |
          [[ -d $RUNNER_TEMP/ui.xcresult ]] || exit 0
          xcrun xcresulttool export attachments \
            --path $RUNNER_TEMP/ui.xcresult \
            --output-path $RUNNER_TEMP/ui-attachments
      - name: Upload failure attachments
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-attachments
          path: ${{ runner.temp }}/ui-attachments
          retention-days: 7
          if-no-files-found: ignore

  # The one check to require on main. "Changes" and the isolation job always run and must pass; the macOS jobs pass or
  # are skipped because none of their inputs changed. A failed or cancelled job fails the gate, so a docs-only change
  # goes green without a macOS runner and a broken "Changes" job can never skip its way to green.
  gate:
    name: Swift tests
    if: ${{ always() }}
    needs: [changes, isolation, arktcore, shellkit, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          ISOLATION: ${{ needs.isolation.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          [ "$CHANGES" = success ] && [ "$ISOLATION" = success ] || exit 1
          for r in $RESULTS; do
            case $r in success|skipped) ;; *) exit 1 ;; esac
          done
